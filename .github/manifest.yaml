            builds:
                sharedlib:
                    sha: de9d19ef68361312869afecab058ba80fab16506
                    artifact_id: artifact-a-de9d19ef68361312869afecab058ba80fab16506
            deploys:
                app:
                    sha: de9d19ef68361312869afecab058ba80fab16506
                    deployed_at: "2026-06-23T23:55:52Z"
