ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.13.0-rc.1
        cli_version_sha: 3ed14b65af7c3922f45bca4126386fe8009e8027
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: 2cc47a91ed91289c1dda46b57f95455ecdc3017b
            version: v0.1.0
            committed_at: "2026-07-09T19:21:09Z"
            committed_by: joshua-temple
        staging:
            sha: 2cc47a91ed91289c1dda46b57f95455ecdc3017b
            version: v0.1.0-rc.0
            committed_at: "2026-07-09T19:15:36Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 2cc47a91ed91289c1dda46b57f95455ecdc3017b
                    artifact_id: artifact-a-2cc47a91ed91289c1dda46b57f95455ecdc3017b
            deploys:
                app:
                    sha: 2cc47a91ed91289c1dda46b57f95455ecdc3017b
                    deployed_at: "2026-07-09T19:15:36Z"
                    deployed_by: joshua-temple
            external:
