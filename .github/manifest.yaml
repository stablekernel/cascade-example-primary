            version: v0.1.0-rc.0
            committed_at: "2026-11-09T06:06:51Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 1a8090d31cfa75cb7570ed3027cc833808ba1c9f
                    artifact_id: artifact-a-1a8090d31cfa75cb7570ed3027cc833808ba1c9f
            deploys:
