          sha: 280c102c032e39c73ac63f9e1848d8fe97aa44fe
          deployed_at: "2026-06-23T18:10:35Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 280c102c032e39c73ac63f9e1848d8fe97aa44fe
          artifact_id: artifact-a-280c102c032e39c73ac63f9e1848d8fe97aa44fe
