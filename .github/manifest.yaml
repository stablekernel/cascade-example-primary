ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.8.0-rc.5
        cli_version_sha: 308fd8ae1beaf5bdfca0820d78028bb38589b9e4
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: e302c65e80007f570172ccbf517ac19bd794c3be
            version: v0.1.0
            committed_at: "2026-07-05T04:59:57Z"
            committed_by: joshua-temple
        staging:
            sha: e302c65e80007f570172ccbf517ac19bd794c3be
            version: v0.1.0-rc.0
            committed_at: "2026-07-05T04:54:37Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: e302c65e80007f570172ccbf517ac19bd794c3be
                    artifact_id: artifact-a-e302c65e80007f570172ccbf517ac19bd794c3be
            deploys:
                app:
                    sha: e302c65e80007f570172ccbf517ac19bd794c3be
                    deployed_at: "2026-07-05T04:54:37Z"
