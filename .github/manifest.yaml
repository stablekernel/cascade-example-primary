ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.16.2-rc.1
        cli_version_sha: bd09d0d085c348317c2d718e4bf54bbf8f583a6c
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: f282b90d9f4ec973403cf4a406df5f7342dcab26
            version: v0.1.0-rc.0
            committed_at: "2026-07-16T17:58:28Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: f282b90d9f4ec973403cf4a406df5f7342dcab26
                    artifact_id: artifact-a-f282b90d9f4ec973403cf4a406df5f7342dcab26
            deploys:
                app:
                    sha: f282b90d9f4ec973403cf4a406df5f7342dcab26
                    deployed_at: "2026-07-16T17:58:28Z"
                    deployed_by: joshua-temple
            external:
                artifact-b:
                    repo: stablekernel/cascade-example-artifact-b
