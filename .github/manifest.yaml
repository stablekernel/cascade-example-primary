            version: v0.1.0-rc.0
            committed_at: "2026-07-13T07:03:06Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 46cd4508ebd7a7985ca52bfd32508cb9eebee4d4
                    artifact_id: artifact-a-46cd4508ebd7a7985ca52bfd32508cb9eebee4d4
            deploys:
                app:
                    sha: 46cd4508ebd7a7985ca52bfd32508cb9eebee4d4
