      deploys:
        app:
          sha: da5679876daa528c0116b91e4f9083ab65d45e83
          deployed_at: "2026-07-21T07:38:17Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: da5679876daa528c0116b91e4f9083ab65d45e83
          artifact_id: artifact-a-da5679876daa528c0116b91e4f9083ab65d45e83
  latest_release:
