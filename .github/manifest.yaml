                    sha: 3ec63ccea0cedf766c6e6aaad6e7f5954401c771
                    artifact_id: artifact-a-3ec63ccea0cedf766c6e6aaad6e7f5954401c771
            deploys:
                app:
                    sha: 3ec63ccea0cedf766c6e6aaad6e7f5954401c771
                    deployed_at: "2026-06-16T23:02:00Z"
                    deployed_by: joshua-temple
            external:
