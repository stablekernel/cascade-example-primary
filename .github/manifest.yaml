          deployed_at: "2026-06-26T06:43:09Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: e4f4fbe969112da9f9fa5379a1697abeb758c084
          artifact_id: artifact-a-e4f4fbe969112da9f9fa5379a1697abeb758c084
