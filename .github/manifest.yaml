ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.15.0-rc.1
        cli_version_sha: c25c4de6f1cad95ddb6654bf764ea6aa9e687acd
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: f3e0bc30555c609de49dc0c4572d9db858840261
            version: v0.1.0
            committed_at: "2026-07-12T04:30:47Z"
            committed_by: joshua-temple
        staging:
            sha: f3e0bc30555c609de49dc0c4572d9db858840261
            version: v0.15.0-rc.1
            committed_at: "2026-07-12T04:25:32Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: f3e0bc30555c609de49dc0c4572d9db858840261
                    artifact_id: artifact-a-f3e0bc30555c609de49dc0c4572d9db858840261
            deploys:
                app:
                    sha: f3e0bc30555c609de49dc0c4572d9db858840261
