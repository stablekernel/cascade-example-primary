ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.16.6-rc.1
        cli_version_sha: 82d7a676a50e7a54ad666d0f55277dcf04415cfb
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: c8059e4f8ffdaac33e270f3ede6078f798f99cc8
            version: v0.1.0
            committed_at: "2026-07-21T00:18:55Z"
            committed_by: joshua-temple
        staging:
            sha: c8059e4f8ffdaac33e270f3ede6078f798f99cc8
            version: v0.1.0-rc.0
            committed_at: "2026-07-21T00:13:39Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: c8059e4f8ffdaac33e270f3ede6078f798f99cc8
                    artifact_id: artifact-a-c8059e4f8ffdaac33e270f3ede6078f798f99cc8
            deploys:
                app:
                    sha: c8059e4f8ffdaac33e270f3ede6078f798f99cc8
                    deployed_at: "2026-07-21T00:13:39Z"
                    deployed_by: joshua-temple
            external:
