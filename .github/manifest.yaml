                    sha: 5a83871ba3feab30d9a2d9d62ab18ac7a62ec28d
                    artifact_id: artifact-a-5a83871ba3feab30d9a2d9d62ab18ac7a62ec28d
            deploys:
                app:
                    sha: 5a83871ba3feab30d9a2d9d62ab18ac7a62ec28d
