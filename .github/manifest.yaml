ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.4.0-rc.4
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: b1afc6eb254e8e9f2d73dbf489cc7bad077111df
            version: v0.1.0
            committed_at: "2026-06-24T16:17:10Z"
            committed_by: joshua-temple
        staging:
            sha: b1afc6eb254e8e9f2d73dbf489cc7bad077111df
            version: v0.1.0-rc.0
            committed_at: "2026-06-24T16:15:02Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: b1afc6eb254e8e9f2d73dbf489cc7bad077111df
                    artifact_id: artifact-a-b1afc6eb254e8e9f2d73dbf489cc7bad077111df
            deploys:
                app:
                    sha: b1afc6eb254e8e9f2d73dbf489cc7bad077111df
                    deployed_at: "2026-06-24T16:15:02Z"
                    deployed_by: joshua-temple
            external:
