ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.5.0-rc.10
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: 7a40ad0259e643fc2c5eec00163840e79f80e4b4
            version: v0.1.0-rc.0
            committed_at: "2026-06-26T07:55:31Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 7a40ad0259e643fc2c5eec00163840e79f80e4b4
                    artifact_id: artifact-a-7a40ad0259e643fc2c5eec00163840e79f80e4b4
            deploys:
                app:
                    sha: 7a40ad0259e643fc2c5eec00163840e79f80e4b4
                    deployed_at: "2026-06-26T07:55:31Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
