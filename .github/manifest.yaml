            version: v0.1.0-rc.0
            committed_at: "2026-06-25T22:06:17Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: eaeac1efce512e932fee14a2ef8243cc877b8db7
                    artifact_id: artifact-a-eaeac1efce512e932fee14a2ef8243cc877b8db7
            deploys:
                app:
                    sha: eaeac1efce512e932fee14a2ef8243cc877b8db7
                    deployed_at: "2026-06-25T22:06:17Z"
