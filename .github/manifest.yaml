ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.4.2-rc.1
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: e596fbe34286b2f6ea812695f2dfae241e25eea5
            version: v0.1.0-rc.0
            committed_at: "2026-06-25T02:39:05Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: e596fbe34286b2f6ea812695f2dfae241e25eea5
                    artifact_id: artifact-a-e596fbe34286b2f6ea812695f2dfae241e25eea5
            deploys:
                app:
                    sha: e596fbe34286b2f6ea812695f2dfae241e25eea5
                    deployed_at: "2026-06-25T02:39:05Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
