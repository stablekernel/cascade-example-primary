ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.16.2-rc.2
        cli_version_sha: 24a911250c5f899cac8bbe97a5170286c99978fb
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: bd97bc81d5bb9d8a00757b3ede8c346e0c10610d
            version: v0.1.0-rc.0
            committed_at: "2026-07-16T21:09:37Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: bd97bc81d5bb9d8a00757b3ede8c346e0c10610d
                    artifact_id: artifact-a-bd97bc81d5bb9d8a00757b3ede8c346e0c10610d
            deploys:
                app:
                    sha: bd97bc81d5bb9d8a00757b3ede8c346e0c10610d
                    deployed_at: "2026-07-16T21:09:37Z"
                    deployed_by: joshua-temple
            external:
                artifact-b:
                    repo: stablekernel/cascade-example-artifact-b
