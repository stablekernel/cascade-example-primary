        app:
          sha: 073a48a13328a42f47411f45daec947b7a3402eb
          deployed_at: "2026-06-24T04:03:56Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 073a48a13328a42f47411f45daec947b7a3402eb
          artifact_id: artifact-a-073a48a13328a42f47411f45daec947b7a3402eb
