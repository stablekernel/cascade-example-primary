            builds:
                sharedlib:
                    sha: e337d5ece97a56471ce8a56438c62fad0f84f434
                    artifact_id: artifact-a-e337d5ece97a56471ce8a56438c62fad0f84f434
            deploys:
                app:
                    sha: e337d5ece97a56471ce8a56438c62fad0f84f434
