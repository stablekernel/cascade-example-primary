ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.16.2-rc.0
        cli_version_sha: c35b673ce5ea01782e8d3fd7a6244469f3b9b93f
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: b14cbecfa15bd6e5ff35fc196b696f2147d98a32
            version: v0.1.0
            committed_at: "2026-07-16T07:52:18Z"
            committed_by: joshua-temple
        staging:
            sha: b14cbecfa15bd6e5ff35fc196b696f2147d98a32
            version: v0.1.0-rc.0
            committed_at: "2026-07-16T07:46:16Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: b14cbecfa15bd6e5ff35fc196b696f2147d98a32
                    artifact_id: artifact-a-b14cbecfa15bd6e5ff35fc196b696f2147d98a32
            deploys:
                app:
                    sha: b14cbecfa15bd6e5ff35fc196b696f2147d98a32
