ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v1.1.3-rc.2
    cli_version_sha: 0ded3b4a8e8f5b895e7610465a671e861abfe70d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
      - name: sharedlib
        workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
        triggers: []
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    external:
      - repo: stablekernel/cascade-example-artifact-a
        ref: main
        deploys:
          - name: artifact-a
            workflow: .github/workflows/deploy-artifact-a.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-a.yaml
      - repo: stablekernel/cascade-example-artifact-b
        ref: main
        deploys:
          - name: artifact-b
            workflow: .github/workflows/deploy-artifact-b.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-b.yaml
  state:
    staging:
      sha: e337d5ece97a56471ce8a56438c62fad0f84f434
      version: v0.1.0-rc.0
      committed_at: "2026-11-23T06:06:47Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: e337d5ece97a56471ce8a56438c62fad0f84f434
          deployed_at: "2026-11-23T06:06:47Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: e337d5ece97a56471ce8a56438c62fad0f84f434
          artifact_id: artifact-a-e337d5ece97a56471ce8a56438c62fad0f84f434
  latest_release:
