            version: v0.1.0-rc.0
            committed_at: "2026-06-25T20:15:27Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 89ac381ef478dd1d4c8c5feecc3bc598e76556ca
                    artifact_id: artifact-a-89ac381ef478dd1d4c8c5feecc3bc598e76556ca
            deploys:
                app:
                    sha: 89ac381ef478dd1d4c8c5feecc3bc598e76556ca
                    deployed_at: "2026-06-25T20:15:27Z"
                    deployed_by: joshua-temple
            external:
