            version: v0.1.0-rc.0
            committed_at: "2026-07-19T16:56:28Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 0d64f8999f4e5832f62bb41ba428c1c8300e7af7
                    artifact_id: artifact-a-0d64f8999f4e5832f62bb41ba428c1c8300e7af7
            deploys:
