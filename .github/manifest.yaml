          deployed_at: "2026-06-24T16:43:47Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 2f0d1b9908fbede93d767b496f80e8dd234b2d26
          artifact_id: artifact-a-2f0d1b9908fbede93d767b496f80e8dd234b2d26
