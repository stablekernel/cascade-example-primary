            version: v0.1.0-rc.0
            committed_at: "2026-06-28T00:50:08Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: fc889d677ef564e9cab64ec63518ed6d980cdd61
                    artifact_id: artifact-a-fc889d677ef564e9cab64ec63518ed6d980cdd61
            deploys:
                app:
                    sha: fc889d677ef564e9cab64ec63518ed6d980cdd61
