ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.5.0-rc.0
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: f1c57f58ba2eb04ef6fb21dca95303ba0959e240
            version: v0.1.0-rc.0
            committed_at: "2026-06-25T06:53:06Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: f1c57f58ba2eb04ef6fb21dca95303ba0959e240
                    artifact_id: artifact-a-f1c57f58ba2eb04ef6fb21dca95303ba0959e240
            deploys:
                app:
                    sha: f1c57f58ba2eb04ef6fb21dca95303ba0959e240
                    deployed_at: "2026-06-25T06:53:06Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
