            version: v0.1.0-rc.0
            committed_at: "2026-06-18T15:46:31Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 4f0e118829dbc09bb89b14bb0803866ce712adc9
                    artifact_id: artifact-a-4f0e118829dbc09bb89b14bb0803866ce712adc9
            deploys:
                app:
                    sha: 4f0e118829dbc09bb89b14bb0803866ce712adc9
                    deployed_at: "2026-06-18T15:46:31Z"
