                    sha: b7d3304c5839daded3ce7ce466830ad06119e7c6
                    artifact_id: artifact-a-b7d3304c5839daded3ce7ce466830ad06119e7c6
            deploys:
                app:
                    sha: b7d3304c5839daded3ce7ce466830ad06119e7c6
