      deploys:
        app:
          sha: e0ed578e554d0ebe908c295a5366d98874cfc86d
          deployed_at: "2026-06-27T00:31:13Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: e0ed578e554d0ebe908c295a5366d98874cfc86d
          artifact_id: artifact-a-e0ed578e554d0ebe908c295a5366d98874cfc86d
