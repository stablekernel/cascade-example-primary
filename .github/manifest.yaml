ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v1.1.2-rc.0
        cli_version_sha: 3742e04377b952a263bb48a0a0bb5905c253d603
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: b522c44c1f01603c05e3fd116f3da171fa30358f
            version: v0.1.0
            committed_at: "2026-11-16T06:12:30Z"
            committed_by: joshua-temple
        staging:
            sha: b522c44c1f01603c05e3fd116f3da171fa30358f
            version: v0.1.0-rc.0
            committed_at: "2026-11-16T06:06:51Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: b522c44c1f01603c05e3fd116f3da171fa30358f
                    artifact_id: artifact-a-b522c44c1f01603c05e3fd116f3da171fa30358f
            deploys:
                app:
                    sha: b522c44c1f01603c05e3fd116f3da171fa30358f
                    deployed_at: "2026-11-16T06:06:51Z"
