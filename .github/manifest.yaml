      deploys:
        app:
          sha: f1d80db24213fcf74123ac0c829a07b4870173bf
          deployed_at: "2026-07-08T07:51:51Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: f1d80db24213fcf74123ac0c829a07b4870173bf
          artifact_id: artifact-a-f1d80db24213fcf74123ac0c829a07b4870173bf
  latest_release:
