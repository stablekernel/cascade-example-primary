            builds:
                sharedlib:
                    sha: 5d574961aa78d0d92d59f76f3b9da26504d27259
                    artifact_id: artifact-a-5d574961aa78d0d92d59f76f3b9da26504d27259
            deploys:
                app:
                    sha: 5d574961aa78d0d92d59f76f3b9da26504d27259
                    deployed_at: "2026-06-27T08:46:51Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
