ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v1.1.2-rc.0
        cli_version_sha: 3742e04377b952a263bb48a0a0bb5905c253d603
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: 156aeb1d060ffc42065abeb89942566cf7adf5a2
            version: v0.1.0-rc.0
            committed_at: "2026-10-19T06:10:01Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 156aeb1d060ffc42065abeb89942566cf7adf5a2
                    artifact_id: artifact-a-156aeb1d060ffc42065abeb89942566cf7adf5a2
            deploys:
                app:
                    sha: 156aeb1d060ffc42065abeb89942566cf7adf5a2
                    deployed_at: "2026-10-19T06:10:01Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
                    sha: a17923902400001
                    version: v1.0.0
