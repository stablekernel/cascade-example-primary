      deploys:
        app:
          sha: 230a91cff5526ae61d362130283442950a8eaa2f
          deployed_at: "2026-07-20T14:48:04Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 230a91cff5526ae61d362130283442950a8eaa2f
          artifact_id: artifact-a-230a91cff5526ae61d362130283442950a8eaa2f
  latest_release:
