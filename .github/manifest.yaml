ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.14.0-rc.0
    cli_version_sha: f904ea561ac0ba556b251bca7ea8f54f492c7a54
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
      - name: sharedlib
        workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
        triggers: []
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    external:
      - repo: stablekernel/cascade-example-artifact-a
        ref: main
        deploys:
          - name: artifact-a
            workflow: .github/workflows/deploy-artifact-a.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-a.yaml
      - repo: stablekernel/cascade-example-artifact-b
        ref: main
        deploys:
          - name: artifact-b
            workflow: .github/workflows/deploy-artifact-b.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-b.yaml
  state:
    staging:
      sha: 3e549163f3ea3d17bdaa18a1c77442b7f3faeca9
      version: v0.1.0-rc.0
      committed_at: "2026-07-10T08:12:41Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: 3e549163f3ea3d17bdaa18a1c77442b7f3faeca9
          deployed_at: "2026-07-10T08:12:41Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 3e549163f3ea3d17bdaa18a1c77442b7f3faeca9
          artifact_id: artifact-a-3e549163f3ea3d17bdaa18a1c77442b7f3faeca9
  latest_release:
