ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.16.4-rc.0
        cli_version_sha: 25b365f7f4f16de174120c30cb060b35fa63accd
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: 8ab27e2717ee8359c5cca78ed4499dfce24bed59
            version: v0.1.0
            committed_at: "2026-07-17T10:55:45Z"
            committed_by: joshua-temple
        staging:
            sha: 8ab27e2717ee8359c5cca78ed4499dfce24bed59
            version: v0.1.0-rc.0
            committed_at: "2026-07-17T10:50:03Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 8ab27e2717ee8359c5cca78ed4499dfce24bed59
                    artifact_id: artifact-a-8ab27e2717ee8359c5cca78ed4499dfce24bed59
            deploys:
                app:
                    sha: 8ab27e2717ee8359c5cca78ed4499dfce24bed59
                    deployed_at: "2026-07-17T10:50:03Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
                    sha: de8bbdc6561036185bd5a8f1f412604154b865c8
                    version: v0.1.0-rc.0
