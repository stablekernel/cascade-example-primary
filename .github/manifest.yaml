ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.9.0-dryrun.30
        cli_version_sha: eb796295556dbdaf116735cc09fd6fc79f373e12
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: 85009b00d58a0bc917f5f19c215a45c9f3b2e4ea
            version: v0.1.0-rc.0
            committed_at: "2026-07-05T20:15:42Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 85009b00d58a0bc917f5f19c215a45c9f3b2e4ea
                    artifact_id: artifact-a-85009b00d58a0bc917f5f19c215a45c9f3b2e4ea
            deploys:
                app:
                    sha: 85009b00d58a0bc917f5f19c215a45c9f3b2e4ea
                    deployed_at: "2026-07-05T20:15:42Z"
                    deployed_by: joshua-temple
            external:
