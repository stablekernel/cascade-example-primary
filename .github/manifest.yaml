          deployed_at: "2026-06-17T23:58:44Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 971887cd70169d979236fa6444599edccd7d40b1
          artifact_id: artifact-a-971887cd70169d979236fa6444599edccd7d40b1
