          deployed_at: "2026-06-18T14:26:14Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 761e4855d1595842b0b6206aafedabdb7d756068
          artifact_id: artifact-a-761e4855d1595842b0b6206aafedabdb7d756068
