            builds:
                sharedlib:
                    sha: d862e17268e411e3c829eecc56836ba9bdfdcff9
                    artifact_id: artifact-a-d862e17268e411e3c829eecc56836ba9bdfdcff9
            deploys:
                app:
                    sha: d862e17268e411e3c829eecc56836ba9bdfdcff9
