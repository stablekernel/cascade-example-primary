ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v1.0.0-rc.21
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
        concurrency:
            group: cascade-manifest-${{ github.ref }}
            cancel_in_progress: false
    state:
        prod: {}
        release:
            sha: 5dc29c4300e7fe8d32888a1603bd498e8b9b5cea
            version: v0.1.0
            committed_at: "2026-06-17T15:20:14Z"
            committed_by: joshua-temple
        staging:
            sha: 5dc29c4300e7fe8d32888a1603bd498e8b9b5cea
            version: v0.1.0-rc.0
            committed_at: "2026-06-17T15:18:20Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 5dc29c4300e7fe8d32888a1603bd498e8b9b5cea
                    artifact_id: artifact-a-5dc29c4300e7fe8d32888a1603bd498e8b9b5cea
            deploys:
                app:
                    sha: 5dc29c4300e7fe8d32888a1603bd498e8b9b5cea
                    deployed_at: "2026-06-17T15:18:20Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
                    repo: stablekernel/cascade-example-artifact-a
