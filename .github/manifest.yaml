            committed_at: "2026-07-17T07:49:24Z"
            committed_by: joshua-temple
        staging:
            sha: d73f5e508702d1c8c5c855fce07e787a96034342
            version: v0.16.4-rc.0
            committed_at: "2026-07-17T07:43:53Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: d73f5e508702d1c8c5c855fce07e787a96034342
                    artifact_id: artifact-a-d73f5e508702d1c8c5c855fce07e787a96034342
            deploys:
