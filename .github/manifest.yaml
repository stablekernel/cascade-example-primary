ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.10.0-rc.0
        cli_version_sha: d61d641f4feb12192d9d8eb75b34c414df7da798
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: e7155478fc8b5b28aba3abba78078a02812e4381
            version: v0.1.0
            committed_at: "2026-07-07T03:50:40Z"
            committed_by: joshua-temple
        staging:
            sha: e7155478fc8b5b28aba3abba78078a02812e4381
            version: v0.1.0-rc.0
            committed_at: "2026-07-07T03:45:24Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: e7155478fc8b5b28aba3abba78078a02812e4381
                    artifact_id: artifact-a-e7155478fc8b5b28aba3abba78078a02812e4381
            deploys:
                app:
                    sha: e7155478fc8b5b28aba3abba78078a02812e4381
                    deployed_at: "2026-07-07T03:45:24Z"
                    deployed_by: joshua-temple
            external:
                artifact-a:
