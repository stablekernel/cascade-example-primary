ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.12.0-rc.1
        cli_version_sha: 0b23d064f7715f186d1b48ebd6bb04d6f4a88666
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        release:
            sha: 2dac2f237ae6eb5ed2ae47662f4cf864281da7c9
            version: v0.1.0
            committed_at: "2026-07-08T17:45:36Z"
            committed_by: joshua-temple
        staging:
            sha: 2dac2f237ae6eb5ed2ae47662f4cf864281da7c9
            version: v0.1.0-rc.0
            committed_at: "2026-07-08T17:40:13Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: 2dac2f237ae6eb5ed2ae47662f4cf864281da7c9
                    artifact_id: artifact-a-2dac2f237ae6eb5ed2ae47662f4cf864281da7c9
            deploys:
                app:
                    sha: 2dac2f237ae6eb5ed2ae47662f4cf864281da7c9
                    deployed_at: "2026-07-08T17:40:13Z"
