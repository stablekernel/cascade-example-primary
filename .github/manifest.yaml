            version: v0.1.0-rc.0
            committed_at: "2026-07-09T17:00:29Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: fb250c9090f0c7c31237d8eacbb4078bc56a425c
                    artifact_id: artifact-a-fb250c9090f0c7c31237d8eacbb4078bc56a425c
            deploys:
                app:
