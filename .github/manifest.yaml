ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.15.0-rc.0
    cli_version_sha: 090e765ba8b485767d60c70f222605fee44fff50
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
      - name: sharedlib
        workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
        triggers: []
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    external:
      - repo: stablekernel/cascade-example-artifact-a
        ref: main
        deploys:
          - name: artifact-a
            workflow: .github/workflows/deploy-artifact-a.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-a.yaml
      - repo: stablekernel/cascade-example-artifact-b
        ref: main
        deploys:
          - name: artifact-b
            workflow: .github/workflows/deploy-artifact-b.yaml
            on_update:
              deploy:
                workflow: .github/workflows/deploy-artifact-b.yaml
  state: {}
  latest_release:
    version: v0.1.0
    sha: 663524a90fd9e1d8e090bad21f3968a5dc7576e3
    released_on: "2026-07-11T13:40:42Z"
    released_by: joshua-temple
