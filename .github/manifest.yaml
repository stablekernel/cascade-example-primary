ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v1.1.3-rc.1
        cli_version_sha: 318e9749942e1dd514ad540cdb6d7a077b9d2f84
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
            - name: sharedlib
              workflow: stablekernel/cascade-example-artifact-a/.github/workflows/build-shared.yaml@main
              triggers: []
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        external:
            - repo: stablekernel/cascade-example-artifact-a
              ref: main
              deploys:
                - name: artifact-a
                  workflow: .github/workflows/deploy-artifact-a.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-a.yaml
            - repo: stablekernel/cascade-example-artifact-b
              ref: main
              deploys:
                - name: artifact-b
                  workflow: .github/workflows/deploy-artifact-b.yaml
                  on_update:
                    deploy:
                        workflow: .github/workflows/deploy-artifact-b.yaml
    state:
        prod: {}
        staging:
            sha: dff12b6cc2c55076ae4f0a296af03f023dbc0639
            version: v0.1.0-rc.0
            committed_at: "2026-11-21T07:08:39Z"
            committed_by: joshua-temple
            builds:
                sharedlib:
                    sha: dff12b6cc2c55076ae4f0a296af03f023dbc0639
                    artifact_id: artifact-a-dff12b6cc2c55076ae4f0a296af03f023dbc0639
            deploys:
                app:
                    sha: dff12b6cc2c55076ae4f0a296af03f023dbc0639
                    deployed_at: "2026-11-21T07:08:39Z"
                    deployed_by: joshua-temple
            external:
                artifact-b:
                    repo: stablekernel/cascade-example-artifact-b
                    sha: b17952449500002
                    version: v2.0.0
