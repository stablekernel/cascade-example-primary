        app:
          sha: 62ec5f43d516df94dfc7e60394cb2eac5cf59a1d
          deployed_at: "2026-06-24T23:25:46Z"
          deployed_by: joshua-temple
      builds:
        sharedlib:
          sha: 62ec5f43d516df94dfc7e60394cb2eac5cf59a1d
          artifact_id: artifact-a-62ec5f43d516df94dfc7e60394cb2eac5cf59a1d
