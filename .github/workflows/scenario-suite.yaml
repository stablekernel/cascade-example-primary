name: Scenario Suite - Cross-Repo Pipeline Validation

# End-to-end driver for the cross-repo primary. It exercises BOTH cross-repo
# mechanisms this repo owns:
#   1. Synchronous external uses: callback - the orchestrate run calls
#      stablekernel/cascade-example-artifact-a build-shared.yaml@main.
#   2. Asynchronous External Update - artifact-a and artifact-b dispatch this
#      repo's external-update.yaml, each writing its {deploy_name, sha, version}
#      into the shared manifest under state.<env>.external.<name>.
# After each stage the suite reads back the full manifest snapshot (both envs and
# both external sources) plus tags and releases, and asserts no update is lost
# when the two sources update the shared manifest concurrently.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
  CASCADE_STATE_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
  ARTIFACT_A_REPO: stablekernel/cascade-example-artifact-a
  ARTIFACT_B_REPO: stablekernel/cascade-example-artifact-b
  STAGING_ENV: staging

jobs:
  reset:
    name: Reset manifest state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Reset manifest state
        run: |
          yq eval '.ci.state = {}' -i .github/manifest.yaml
          git add -A
          git diff --cached --quiet || git commit --no-gpg-sign -m "chore: reset state for scenario test [skip ci]"
          git push origin main

      - name: Clean slate - delete leftover releases and tags
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true; done
          git fetch --tags --quiet || true
          for t in $(git tag -l 'v*' 'rel-*'); do git push origin --delete "$t" 2>/dev/null || true; done

      - name: Verify reset
        run: |
          state="$(yq eval '.ci.state' .github/manifest.yaml)"
          if [ "$state" != "{}" ] && [ -n "$state" ] && [ "$state" != "null" ]; then
            echo "::error::manifest ci.state is not clean: $state"
            exit 1
          fi
          echo "manifest state is clean"

  merge-and-build:
    name: Commit in primary - prerelease + external slots
    runs-on: ubuntu-latest
    needs: reset
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Seed src change via pull request (emulates a real user)
        id: seed
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "scenario-suite"
          git config user.email "scenario-suite@users.noreply.github.com"

          # Unique branch so re-runs never collide.
          BRANCH="scenario/src-$(date +%s)-$RANDOM"
          git fetch origin main --quiet
          git checkout -B "$BRANCH" origin/main

          # The user code change - MUST touch src/** to match orchestrate's path filter.
          mkdir -p src
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > src/version.txt
          git add src/version.txt

          # Commit message is cosmetic under squash; the PR title carries the
          # conventional type. No [skip ci]/[ci skip] anywhere or orchestrate is cancelled.
          git commit --no-gpg-sign -m "feat: dummy src change for scenario test"
          git push origin "$BRANCH"

          # Open + squash-merge with the PAT so the merge is PAT-authored and the
          # on: push event fires. Title => squashed commit subject => version bump.
          gh pr create --base main --head "$BRANCH" \
            --title "feat: dummy src change for scenario test" \
            --body "Automated scenario run; drives orchestrate on merge."
          gh pr merge "$BRANCH" --squash --delete-branch

          # Capture the exact merge SHA on trunk - the key for the wait loop.
          git fetch origin main --quiet
          MERGE_SHA=$(git rev-parse origin/main)
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for orchestrate to complete
        id: wait_orchestrate
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          MERGE_SHA: ${{ steps.seed.outputs.merge_sha }}
        run: |
          MAX_ATTEMPTS=10
          SLEEP_DURATION=60
          ATTEMPT=0
          RUN_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            RUN_ID=$(gh run list --workflow=orchestrate.yaml --branch=main \
              --json=databaseId,headSha,status \
              --jq=".[] | select(.headSha==\"$MERGE_SHA\") | .databaseId" 2>/dev/null | head -n1)
            if [ -n "$RUN_ID" ]; then
              echo "Found orchestrate run for merge $MERGE_SHA: $RUN_ID"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_DURATION"
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::no orchestrate.yaml run for merge $MERGE_SHA within timeout"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 60
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Assert staging populated and draft release created
        run: |
          git pull --rebase origin main
          STAGING_VERSION=$(yq eval '.ci.state.staging.version // ""' .github/manifest.yaml)
          if [ -z "$STAGING_VERSION" ]; then
            echo "::error::.ci.state.staging.version is empty after build"
            exit 1
          fi
          if ! echo "$STAGING_VERSION" | grep -qE 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::staging.version is not semver: $STAGING_VERSION"
            exit 1
          fi
          # Orchestrate publishes the staging RC as a DRAFT release (manage-release
          # action=update; see internal/release/command.go). The draft is converted
          # to a pre-release only at promotion time (action=prerelease). So directly
          # after a build the correct invariant is draft=true, prerelease=false.
          RELEASE_TAG=$(gh release list --limit=1 | tail -1 | awk '{print $1}')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::no GitHub release found"
            exit 1
          fi
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --json=isDraft --jq='.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::release $RELEASE_TAG is not a draft after build (got isDraft=$IS_DRAFT)"
            exit 1
          fi
          echo "OK: staging=$STAGING_VERSION release=$RELEASE_TAG draft=$IS_DRAFT"

      - name: Assert cross-repo build artifact consolidated into state
        env:
          MERGE_SHA: ${{ steps.seed.outputs.merge_sha }}
        run: |
          # Deterministic proof of the cross-repo @ref build callback. The
          # orchestrate run calls artifact-a's build-shared.yaml@main with
          # sha=<setup head_sha> (the trunk merge SHA). That reusable workflow
          # emits artifact_id=artifact-a-<sha>, which cascade consolidates into
          # the primary's state at .ci.state.staging.builds.sharedlib.artifact_id
          # exactly like a local build (generator.go:1472,1530-1534). The build
          # name "sharedlib" is the manifest builds[].name; the value is the
          # callback's artifact output, so a populated slot carrying the expected
          # value proves the cross-repo callback's artifact round-tripped home.
          #
          # finalize pushes the build state on the same orchestrate run that the
          # prior step already waited to success and pulled, so the slot is on
          # disk; poll-pull a few times only to absorb push/replication lag.
          EXPECT="artifact-a-${MERGE_SHA}"
          MAX_ATTEMPTS=2
          ATTEMPT=0
          ARTIFACT_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            git pull --rebase origin main --quiet || true
            ARTIFACT_ID=$(yq eval '.ci.state.staging.builds.sharedlib.artifact_id // ""' .github/manifest.yaml)
            [ -n "$ARTIFACT_ID" ] && break
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::cross-repo build slot .ci.state.staging.builds.sharedlib.artifact_id is empty after a successful orchestrate (cross-repo artifact consolidation defect)"
            exit 1
          fi
          if [ "$ARTIFACT_ID" != "$EXPECT" ]; then
            echo "::error::cross-repo artifact_id mismatch: want '$EXPECT' got '$ARTIFACT_ID'"
            exit 1
          fi
          echo "OK: cross-repo @ref callback artifact consolidated: sharedlib.artifact_id=$ARTIFACT_ID"

      - name: Snapshot manifest (all envs + external sources)
        run: |
          {
            echo "## merge-and-build Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| staging.version | $(yq eval '.ci.state.staging.version // "~"' .github/manifest.yaml) |"
            echo "| prod.version | $(yq eval '.ci.state.prod.version // "~"' .github/manifest.yaml) |"
          } >> "$GITHUB_STEP_SUMMARY"

  external-update-concurrent:
    name: Concurrent External Update from artifact-a and artifact-b
    runs-on: ubuntu-latest
    needs: merge-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Dispatch External Update for artifact-a and artifact-b (concurrent)
        run: |
          A_SHA="a$(date +%s)0001"
          B_SHA="b$(date +%s)0002"
          echo "A_SHA=$A_SHA" >> "$GITHUB_ENV"
          echo "B_SHA=$B_SHA" >> "$GITHUB_ENV"
          # Record a dispatch boundary so the wait step only counts runs from
          # THIS scenario. Without it, gh run list matches stale external-update
          # runs from prior suite iterations (a leftover failure from an earlier
          # run aborts this one even though both fresh dispatches succeed).
          # Back-date 60s to absorb runner/API clock skew at the boundary.
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          # Fire both dispatches back-to-back so they race on the shared manifest.
          # Each external-update run uses a per-component concurrency group
          # (cascade-external-<deploy_name>-<ref>), so dispatches from distinct
          # components (artifact-a, artifact-b) run independently and BOTH land
          # with no cross-cancellation. See cascade #210.
          gh workflow run external-update.yaml \
            -f source_repo="$ARTIFACT_A_REPO" \
            -f deploy_name=artifact-a \
            -f environment="$STAGING_ENV" \
            -f sha="$A_SHA" \
            -f version=v1.0.0 \
            -f artifacts='{"artifact_id":"artifact-a-'"$A_SHA"'"}' \
            --ref main
          gh workflow run external-update.yaml \
            -f source_repo="$ARTIFACT_B_REPO" \
            -f deploy_name=artifact-b \
            -f environment="$STAGING_ENV" \
            -f sha="$B_SHA" \
            -f version=v2.0.0 \
            -f artifacts='{"artifact_name":"widget-b-'"$B_SHA"'"}' \
            --ref main

      - name: Wait for both External Update runs to succeed
        run: |
          # Both dispatched external-update runs must reach SUCCESS, not merely
          # "completed". A failed run also reports as completed, so counting
          # completed runs masks a dropped slot. Require two successes and fail
          # loudly (surfacing any failed run) if a dispatch did not commit its
          # state, rather than racing the assertion against a half-written tree.
          # Scope every query to runs created at/after the dispatch boundary so
          # stale runs from earlier suite iterations cannot satisfy the success
          # count or trip the failure guard.
          MAX_ATTEMPTS=10
          SLEEP_DURATION=60
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            SUCCEEDED=$(gh run list --workflow=external-update.yaml --branch=main \
              --status=success --created=">=$DISPATCH_SINCE" --limit=10 \
              --json=databaseId --jq='length' 2>/dev/null || echo 0)
            if [ "$SUCCEEDED" -ge 2 ]; then
              echo "Both External Update runs succeeded"
              break
            fi
            FAILED=$(gh run list --workflow=external-update.yaml --branch=main \
              --status=failure --created=">=$DISPATCH_SINCE" --limit=10 \
              --json=databaseId --jq='length' 2>/dev/null || echo 0)
            if [ "$FAILED" -ge 1 ]; then
              echo "::error::An External Update run failed (concurrent state push not absorbed)."
              gh run list --workflow=external-update.yaml --branch=main \
                --created=">=$DISPATCH_SINCE" --limit 4 || true
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_DURATION"
          done
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::External Update runs did not both succeed within timeout"
            exit 1
          fi

      - name: Assert both sources absorbed with no loss (serialized)
        run: |
          # Hard-reset to trunk so the read reflects both committed state pushes,
          # not a stale or partially-rebased local tree.
          git fetch origin main --quiet
          git reset --hard origin/main
          A_ABSORBED_SHA=$(yq eval '.ci.state.staging.external.artifact-a.sha // ""' .github/manifest.yaml)
          A_ABSORBED_VER=$(yq eval '.ci.state.staging.external.artifact-a.version // ""' .github/manifest.yaml)
          B_ABSORBED_SHA=$(yq eval '.ci.state.staging.external.artifact-b.sha // ""' .github/manifest.yaml)
          B_ABSORBED_VER=$(yq eval '.ci.state.staging.external.artifact-b.version // ""' .github/manifest.yaml)

          if [ "$A_ABSORBED_SHA" != "$A_SHA" ]; then
            echo "::error::artifact-a sha not absorbed: want $A_SHA got '$A_ABSORBED_SHA'"
            exit 1
          fi
          if [ "$A_ABSORBED_VER" != "v1.0.0" ]; then
            echo "::error::artifact-a version not absorbed: want v1.0.0 got '$A_ABSORBED_VER'"
            exit 1
          fi
          if [ "$B_ABSORBED_SHA" != "$B_SHA" ]; then
            echo "::error::artifact-b sha not absorbed: want $B_SHA got '$B_ABSORBED_SHA'"
            exit 1
          fi
          if [ "$B_ABSORBED_VER" != "v2.0.0" ]; then
            echo "::error::artifact-b version not absorbed: want v2.0.0 got '$B_ABSORBED_VER'"
            exit 1
          fi
          echo "OK: both external sources absorbed with no loss"

      - name: Snapshot external sources
        run: |
          {
            echo "## external-update-concurrent Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state.staging.external' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Source | sha | version |"
            echo "|--------|-----|---------|"
            echo "| artifact-a | $(yq eval '.ci.state.staging.external.artifact-a.sha // "~"' .github/manifest.yaml) | $(yq eval '.ci.state.staging.external.artifact-a.version // "~"' .github/manifest.yaml) |"
            echo "| artifact-b | $(yq eval '.ci.state.staging.external.artifact-b.sha // "~"' .github/manifest.yaml) | $(yq eval '.ci.state.staging.external.artifact-b.version // "~"' .github/manifest.yaml) |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-staging:
    name: Promote staging to prod
    runs-on: ubuntu-latest
    needs: external-update-concurrent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Dispatch promote workflow
        run: |
          # Capture a UTC dispatch boundary BEFORE firing so the wait step can
          # correlate the run THIS scenario started, not a stale promote run from
          # an earlier suite iteration. Back-date 60s to absorb clock skew.
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          gh workflow run promote.yaml -f mode=default --ref main

      - name: Wait for promote to complete
        run: |
          # Resolve the promote run dispatched by THIS scenario (created at/after
          # the recorded boundary), then watch THAT id to completion and require
          # conclusion==success. Counting any "completed" run masks a failed
          # promotion, so assert success explicitly.
          MAX_ATTEMPTS=8
          SLEEP_DURATION=60
          ATTEMPT=0
          RUN_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            RUN_ID=$(gh run list --workflow=promote.yaml --branch=main \
              --created=">=$DISPATCH_SINCE" --limit=1 \
              --json=databaseId --jq='.[0].databaseId // empty' 2>/dev/null || echo "")
            if [ -n "$RUN_ID" ]; then
              echo "Found promote run for this dispatch: $RUN_ID"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_DURATION"
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::promote.yaml run for this dispatch did not appear within timeout"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 60

      - name: Assert release published, external state preserved
        run: |
          # In a [staging, prod] topology the terminal promotion publishes the
          # release and records the version under the .ci.state.release marker
          # (cascade's published-version marker), not under the per-environment
          # prod deploy slot. The final env emits no deploy jobs, so
          # .ci.state.prod stays empty by design; assert the release marker
          # carries the published semver instead.
          #
          # finalize pushes its state commit shortly after the promote run
          # reports completed, so poll-pull until the marker lands on main.
          MAX_ATTEMPTS=3
          ATTEMPT=0
          RELEASE_VERSION=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            git pull --rebase origin main --quiet || true
            RELEASE_VERSION=$(yq eval '.ci.state.release.version // ""' .github/manifest.yaml)
            [ -n "$RELEASE_VERSION" ] && break
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          if [ -z "$RELEASE_VERSION" ] || ! echo "$RELEASE_VERSION" | grep -qE 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::.ci.state.release.version missing or not semver: '$RELEASE_VERSION'"
            exit 1
          fi
          # External source state must survive the promote (no loss across stages).
          A_SHA_AFTER=$(yq eval '.ci.state.staging.external.artifact-a.sha // ""' .github/manifest.yaml)
          B_SHA_AFTER=$(yq eval '.ci.state.staging.external.artifact-b.sha // ""' .github/manifest.yaml)
          if [ -z "$A_SHA_AFTER" ] || [ -z "$B_SHA_AFTER" ]; then
            echo "::error::external source state lost during promote (a='$A_SHA_AFTER' b='$B_SHA_AFTER')"
            exit 1
          fi
          RELEASE_TAG=$(gh release list --limit=1 | tail -1 | awk '{print $1}')
          IS_PRERELEASE=$(gh release view "$RELEASE_TAG" --json=isPrerelease --jq='.isPrerelease')
          if [ "$IS_PRERELEASE" != "false" ]; then
            echo "::error::release $RELEASE_TAG still prerelease after promote"
            exit 1
          fi
          echo "OK: release marker=$RELEASE_VERSION tag=$RELEASE_TAG published; external state preserved"

      - name: Final snapshot (all envs + all external sources + release)
        if: always()
        run: |
          {
            echo "## promote-staging Final Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Assertion | Result |"
            echo "|-----------|--------|"
            echo "| Synchronous external uses: callback ran | check merge-and-build |"
            echo "| artifact-a absorbed (no loss) | check external-update-concurrent |"
            echo "| artifact-b absorbed (no loss) | check external-update-concurrent |"
            echo "| Concurrent updates serialized | check external-update-concurrent |"
            echo "| prod published + external preserved | OK |"
          } >> "$GITHUB_STEP_SUMMARY"
