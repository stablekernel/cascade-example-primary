name: Scenario Suite - Cross-Repo Pipeline Validation

# End-to-end driver for the cross-repo primary. It exercises BOTH cross-repo
# mechanisms this repo owns:
#   1. Synchronous external uses: callback - the orchestrate run calls
#      stablekernel/cascade-example-artifact-a build-shared.yaml@main.
#   2. Asynchronous External Update - artifact-a and artifact-b dispatch this
#      repo's external-update.yaml, each writing its {deploy_name, sha, version}
#      into the shared manifest under state.<env>.external.<name>.
# After each stage the suite reads back the full manifest snapshot (both envs and
# both external sources) plus tags and releases, and asserts no update is lost
# when the two sources update the shared manifest concurrently.

on:
  workflow_dispatch:
    inputs:
      cascade_version:
        description: 'cascade rc tag to self-repin to (e.g. v0.16.6-dryrun.82). Empty runs committed defaults.'
        required: false
        default: ''
      cascade_version_sha:
        description: 'Peeled commit SHA paired with cascade_version. Empty runs committed defaults.'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

concurrency:
  group: scenario-suite
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
  CASCADE_STATE_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
  ARTIFACT_A_REPO: stablekernel/cascade-example-artifact-a
  ARTIFACT_B_REPO: stablekernel/cascade-example-artifact-b
  STAGING_ENV: staging

jobs:
  reset:
    name: Reset manifest state
    runs-on: ubuntu-latest
    outputs:
      # Captured before anything is dispatched or merged. The reconcile job
      # enumerates every run this repo produced at or after this instant and
      # fails if any is unaccounted for in the ledger. Recorded as the very first
      # step of the first job so no run the suite causes can fall outside it.
      window-start: ${{ steps.window.outputs.window-start }}
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # The reconcile window opens here, before the first reset push, dispatch,
      # or merge. Every run the suite goes on to cause lands at or after this
      # timestamp, so the reconcile job sees all of them.
      - name: Open reconcile window
        id: window
        run: |
          set -euo pipefail
          WINDOW_START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "window-start=$WINDOW_START" >> "$GITHUB_OUTPUT"
          echo "reconcile window opened at $WINDOW_START"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log cascade version mode
        run: |
          if [ -n "${{ inputs.cascade_version }}" ]; then
            echo "Running against dispatched rc: ${{ inputs.cascade_version }} (sha ${{ inputs.cascade_version_sha }})"
          else
            echo "Running against committed defaults (no rc dispatched)"
          fi

      - name: Self-repin manifest to the dispatched rc
        uses: stablekernel/cascade/.github/actions/fleet-repin@main
        with:
          cascade_version: ${{ inputs.cascade_version }}
          cascade_version_sha: ${{ inputs.cascade_version_sha }}
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Reset manifest state
        run: |
          yq eval '.ci.state = {}' -i .github/manifest.yaml
          git add -A
          git diff --cached --quiet || git commit --no-gpg-sign -m "chore: reset state for scenario test [skip ci]"
          git push origin main

      - name: Clean slate - delete leftover releases and tags
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true; done
          git fetch --tags --quiet || true
          for t in $(git tag -l 'v*' 'rel-*'); do git push origin --delete "$t" 2>/dev/null || true; done

      - name: Verify reset
        run: |
          state="$(yq eval '.ci.state' .github/manifest.yaml)"
          if [ "$state" != "{}" ] && [ -n "$state" ] && [ "$state" != "null" ]; then
            echo "::error::manifest ci.state is not clean: $state"
            exit 1
          fi
          echo "manifest state is clean"

  merge-and-build:
    name: Commit in primary - prerelease + external slots
    runs-on: ubuntu-latest
    needs: reset
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Seed src change via pull request (emulates a real user)
        id: seed
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Unique branch so re-runs never collide.
          BRANCH="scenario/src-$(date +%s)-$RANDOM"
          git fetch origin main --quiet
          git checkout -B "$BRANCH" origin/main

          # The user code change - MUST touch src/** to match orchestrate's path filter.
          mkdir -p src
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > src/version.txt
          git add src/version.txt

          # The branch commit message carries the conventional type; rebase
          # preserves it as the trunk commit subject. No [skip ci]/[ci skip]
          # anywhere or orchestrate is cancelled.
          git commit --no-gpg-sign -m "feat: dummy src change for scenario test"
          git push origin "$BRANCH"

          # Open + rebase-merge: the branch commit replays onto main keeping its
          # github-actions[bot] author, the on: push event fires, and its
          # subject drives the version bump.
          gh pr create --base main --head "$BRANCH" \
            --title "feat: dummy src change for scenario test" \
            --body "Automated scenario run; drives orchestrate on merge."
          gh pr merge "$BRANCH" --rebase --delete-branch

          # Capture the exact merge SHA on trunk - the key for the wait loop.
          git fetch origin main --quiet
          MERGE_SHA=$(git rev-parse origin/main)
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for orchestrate to complete
        id: wait_orchestrate
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          MERGE_SHA: ${{ steps.seed.outputs.merge_sha }}
        run: |
          MAX_ATTEMPTS=10
          SLEEP_DURATION=60
          ATTEMPT=0
          RUN_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            RUN_ID=$(gh run list --workflow=orchestrate.yaml --branch=main \
              --json=databaseId,headSha,status \
              --jq=".[] | select(.headSha==\"$MERGE_SHA\") | .databaseId" 2>/dev/null | head -n1)
            if [ -n "$RUN_ID" ]; then
              echo "Found orchestrate run for merge $MERGE_SHA: $RUN_ID"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_DURATION"
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::no orchestrate.yaml run for merge $MERGE_SHA within timeout"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 60
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Register the orchestrate run this merge triggered so reconcile accounts
      # for it. upload: true so this job's ledger reaches the reconcile job.
      - name: Register orchestrate run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.wait_orchestrate.outputs.run_id }}
          expected-conclusion: success
          reason: merge-and-build-orchestrate
          upload: 'true'

      - name: Assert staging populated and draft release created
        run: |
          git pull --rebase origin main
          STAGING_VERSION=$(yq eval '.ci.state.staging.version // ""' .github/manifest.yaml)
          if [ -z "$STAGING_VERSION" ]; then
            echo "::error::.ci.state.staging.version is empty after build"
            exit 1
          fi
          if ! echo "$STAGING_VERSION" | grep -qE 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::staging.version is not semver: $STAGING_VERSION"
            exit 1
          fi
          # Orchestrate publishes the staging RC as a DRAFT release (manage-release
          # action=update; see internal/release/command.go). The draft is converted
          # to a pre-release only at promotion time (action=prerelease). So directly
          # after a build the correct invariant is draft=true, prerelease=false.
          RELEASE_TAG=$(gh release list --limit=1 | tail -1 | awk '{print $1}')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::no GitHub release found"
            exit 1
          fi
          IS_DRAFT=$(gh release view "$RELEASE_TAG" --json=isDraft --jq='.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::release $RELEASE_TAG is not a draft after build (got isDraft=$IS_DRAFT)"
            exit 1
          fi
          echo "OK: staging=$STAGING_VERSION release=$RELEASE_TAG draft=$IS_DRAFT"

      - name: Assert cross-repo build artifact consolidated into state
        env:
          MERGE_SHA: ${{ steps.seed.outputs.merge_sha }}
        run: |
          # Deterministic proof of the cross-repo @ref build callback. The
          # orchestrate run calls artifact-a's build-shared.yaml@main with
          # sha=<setup head_sha> (the trunk merge SHA). That reusable workflow
          # emits artifact_id=artifact-a-<sha>, which cascade consolidates into
          # the primary's state at .ci.state.staging.builds.sharedlib.artifact_id
          # exactly like a local build (generator.go:1472,1530-1534). The build
          # name "sharedlib" is the manifest builds[].name; the value is the
          # callback's artifact output, so a populated slot carrying the expected
          # value proves the cross-repo callback's artifact round-tripped home.
          #
          # finalize pushes the build state on the same orchestrate run that the
          # prior step already waited to success and pulled, so the slot is on
          # disk; poll-pull a few times only to absorb push/replication lag.
          EXPECT="artifact-a-${MERGE_SHA}"
          MAX_ATTEMPTS=2
          ATTEMPT=0
          ARTIFACT_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            git pull --rebase origin main --quiet || true
            ARTIFACT_ID=$(yq eval '.ci.state.staging.builds.sharedlib.artifact_id // ""' .github/manifest.yaml)
            [ -n "$ARTIFACT_ID" ] && break
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::cross-repo build slot .ci.state.staging.builds.sharedlib.artifact_id is empty after a successful orchestrate (cross-repo artifact consolidation defect)"
            exit 1
          fi
          if [ "$ARTIFACT_ID" != "$EXPECT" ]; then
            echo "::error::cross-repo artifact_id mismatch: want '$EXPECT' got '$ARTIFACT_ID'"
            exit 1
          fi
          echo "OK: cross-repo @ref callback artifact consolidated: sharedlib.artifact_id=$ARTIFACT_ID"

      - name: Snapshot manifest (all envs + external sources)
        run: |
          {
            echo "## merge-and-build Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| staging.version | $(yq eval '.ci.state.staging.version // "~"' .github/manifest.yaml) |"
            echo "| prod.version | $(yq eval '.ci.state.prod.version // "~"' .github/manifest.yaml) |"
          } >> "$GITHUB_STEP_SUMMARY"

  external-update-concurrent:
    name: Concurrent External Update from artifact-a and artifact-b
    runs-on: ubuntu-latest
    needs: merge-and-build
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dispatch External Update for artifact-a and artifact-b (concurrent)
        id: dispatch_external
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          # Each dispatch carries a UNIQUE sha. The external-update run-name is
          # "External Update <deploy_name> <sha>" (see external-update.yaml
          # run-name), so the unique sha lets the wait step resolve the EXACT run
          # id each dispatch produced and watch THAT id - never a stale run, and
          # never some other driver's in-window dispatch (e.g. the shared/dev
          # external-update runs the artifact repos fire at this repo). This
          # replaces the prior time-windowed success/failure COUNT, which could
          # both miss a third in-window failure and mistake an unrelated driver's
          # failing run for one of ours.
          A_SHA="a$(date +%s)0001"
          B_SHA="b$(date +%s)0002"
          echo "A_SHA=$A_SHA" >> "$GITHUB_ENV"
          echo "B_SHA=$B_SHA" >> "$GITHUB_ENV"
          # Record a dispatch boundary used ONLY to scope the per-sha run lookup
          # to this iteration's runs (an old run could never share the unique
          # sha, but the bound keeps the list query small). Back-date 60s for
          # runner/API clock skew.
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          # Fire both dispatches back-to-back so they race on the shared manifest.
          # Each external-update run uses a per-component concurrency group
          # (cascade-external-<deploy_name>-<ref>), so dispatches from distinct
          # components (artifact-a, artifact-b) run independently and BOTH land
          # with no cross-cancellation. See cascade #210.
          gh workflow run external-update.yaml \
            -f source_repo="$ARTIFACT_A_REPO" \
            -f deploy_name=artifact-a \
            -f environment="$STAGING_ENV" \
            -f sha="$A_SHA" \
            -f version=v1.0.0 \
            -f artifacts='{"artifact_id":"artifact-a-'"$A_SHA"'"}' \
            --ref main
          gh workflow run external-update.yaml \
            -f source_repo="$ARTIFACT_B_REPO" \
            -f deploy_name=artifact-b \
            -f environment="$STAGING_ENV" \
            -f sha="$B_SHA" \
            -f version=v2.0.0 \
            -f artifacts='{"artifact_name":"widget-b-'"$B_SHA"'"}' \
            --ref main

      - name: Resolve and watch the two External Update runs by id
        id: external_runs
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=10
          SLEEP_DURATION=60

          # resolve_run <unique-sha> -> prints the databaseId of the
          # external-update run whose run-name carries that exact sha. The sha is
          # unique to this iteration's dispatch, so the match is unambiguous and
          # can never resolve to a stale run or to an unrelated driver's
          # shared/widget-b/dev dispatch in the same window.
          resolve_run() {
            local sha="$1" i id=""
            for ((i=0; i<MAX_ATTEMPTS; i++)); do
              id=$(gh run list --workflow=external-update.yaml --branch=main \
                --created=">=$DISPATCH_SINCE" --limit=30 \
                --json=databaseId,displayTitle \
                --jq ".[] | select(.displayTitle | contains(\"$sha\")) | .databaseId" \
                2>/dev/null | head -n1)
              [ -n "$id" ] && break
              sleep "$SLEEP_DURATION"
            done
            echo "$id"
          }

          A_RUN_ID=$(resolve_run "$A_SHA")
          [ -n "$A_RUN_ID" ] || { echo "::error::no External Update run found for artifact-a sha $A_SHA"; exit 1; }
          B_RUN_ID=$(resolve_run "$B_SHA")
          [ -n "$B_RUN_ID" ] || { echo "::error::no External Update run found for artifact-b sha $B_SHA"; exit 1; }
          echo "resolved artifact-a run $A_RUN_ID, artifact-b run $B_RUN_ID"

          # Watch EACH dispatched run by its own id and require success. A failed
          # run reports as "completed" too, so --exit-status is what proves the
          # state push committed. Watching by id means a third unrelated failing
          # external-update run in the window cannot mask or trip this gate.
          gh run watch "$A_RUN_ID" --exit-status --interval 60 \
            || { echo "::error::artifact-a External Update run $A_RUN_ID did not conclude success"; exit 1; }
          gh run watch "$B_RUN_ID" --exit-status --interval 60 \
            || { echo "::error::artifact-b External Update run $B_RUN_ID did not conclude success"; exit 1; }

          {
            echo "a_run_id=$A_RUN_ID"
            echo "b_run_id=$B_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          echo "both External Update runs concluded success"

      # Register both dispatched External Update runs so reconcile accounts for
      # the exact runs the suite caused (not the unrelated shared/widget-b/dev
      # dispatches other repos fire, which the gate surfaces as unaccounted red).
      - name: Register artifact-a External Update run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.external_runs.outputs.a_run_id }}
          expected-conclusion: success
          reason: external-update-artifact-a
          upload: 'true'

      - name: Register artifact-b External Update run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.external_runs.outputs.b_run_id }}
          expected-conclusion: success
          reason: external-update-artifact-b
          upload: 'true'

      - name: Assert both sources absorbed with no loss (serialized)
        run: |
          # Hard-reset to trunk so the read reflects both committed state pushes,
          # not a stale or partially-rebased local tree.
          git fetch origin main --quiet
          git reset --hard origin/main
          A_ABSORBED_SHA=$(yq eval '.ci.state.staging.external.artifact-a.sha // ""' .github/manifest.yaml)
          A_ABSORBED_VER=$(yq eval '.ci.state.staging.external.artifact-a.version // ""' .github/manifest.yaml)
          B_ABSORBED_SHA=$(yq eval '.ci.state.staging.external.artifact-b.sha // ""' .github/manifest.yaml)
          B_ABSORBED_VER=$(yq eval '.ci.state.staging.external.artifact-b.version // ""' .github/manifest.yaml)

          if [ "$A_ABSORBED_SHA" != "$A_SHA" ]; then
            echo "::error::artifact-a sha not absorbed: want $A_SHA got '$A_ABSORBED_SHA'"
            exit 1
          fi
          if [ "$A_ABSORBED_VER" != "v1.0.0" ]; then
            echo "::error::artifact-a version not absorbed: want v1.0.0 got '$A_ABSORBED_VER'"
            exit 1
          fi
          if [ "$B_ABSORBED_SHA" != "$B_SHA" ]; then
            echo "::error::artifact-b sha not absorbed: want $B_SHA got '$B_ABSORBED_SHA'"
            exit 1
          fi
          if [ "$B_ABSORBED_VER" != "v2.0.0" ]; then
            echo "::error::artifact-b version not absorbed: want v2.0.0 got '$B_ABSORBED_VER'"
            exit 1
          fi
          echo "OK: both external sources absorbed with no loss"

      - name: Snapshot external sources
        run: |
          {
            echo "## external-update-concurrent Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state.staging.external' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Source | sha | version |"
            echo "|--------|-----|---------|"
            echo "| artifact-a | $(yq eval '.ci.state.staging.external.artifact-a.sha // "~"' .github/manifest.yaml) | $(yq eval '.ci.state.staging.external.artifact-a.version // "~"' .github/manifest.yaml) |"
            echo "| artifact-b | $(yq eval '.ci.state.staging.external.artifact-b.sha // "~"' .github/manifest.yaml) | $(yq eval '.ci.state.staging.external.artifact-b.version // "~"' .github/manifest.yaml) |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-gates:
    name: Release guard rails - dry-run skip and serialized concurrency
    runs-on: ubuntu-latest
    needs: external-update-concurrent
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Dry-run promotion: the release workflow's own dry_run skip. With
      # dry_run=true every promote/deploy/finalize job is gated off (see
      # promote.yaml job ifs), so preflight runs, reports, and the run
      # concludes success WITHOUT publishing a release or cutting a tag.
      # Capture the tag set before and after to prove no tag was created.
      - name: Capture tags before dry run
        id: tags_before
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          BEFORE=$(git tag -l | sort | tr '\n' ',' )
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "tags before dry run: $BEFORE"

      - name: Dispatch dry-run promote
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "DRY_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          gh workflow run promote.yaml -f mode=default -f dry_run=true --ref main

      - name: Wait for dry-run promote
        id: wait_dry
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=8
          ATTEMPT=0
          RUN_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            RUN_ID=$(gh run list --workflow=promote.yaml --branch=main \
              --created=">=$DRY_SINCE" --limit=1 \
              --json=databaseId --jq='.[0].databaseId // empty' 2>/dev/null || echo "")
            [ -n "$RUN_ID" ] && break
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep 60
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::dry-run promote run did not appear within timeout"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 60
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Register the dry-run promote run: a dry run is expected to SUCCEED
      # (the gate jobs skip cleanly), so the registered conclusion is success.
      - name: Register dry-run promote run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.wait_dry.outputs.run_id }}
          expected-conclusion: success
          reason: release-dry-run
          upload: 'true'

      - name: Assert dry run created no tag
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          TAGS_BEFORE: ${{ steps.tags_before.outputs.before }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          AFTER=$(git tag -l | sort | tr '\n' ',' )
          if [ "$AFTER" != "$TAGS_BEFORE" ]; then
            echo "::error::dry-run promote changed the tag set: before='$TAGS_BEFORE' after='$AFTER' (a dry run must not cut a tag)"
            exit 1
          fi
          echo "OK: dry-run promote published nothing - tag set unchanged"

      # Serialized concurrency: promote.yaml declares
      #   concurrency: { group: Promote, cancel-in-progress: false }
      # so two promote runs in the same group must NOT cancel each other - the
      # second queues behind the first and both reach a terminal conclusion.
      # Fire two dry-run promotes back to back and assert neither was cancelled.
      - name: Dispatch two concurrent dry-run promotes
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "CONC_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          gh workflow run promote.yaml -f mode=default -f dry_run=true --ref main
          gh workflow run promote.yaml -f mode=default -f dry_run=true --ref main

      - name: Resolve and assert both promotes serialized (neither cancelled)
        id: conc
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          # Wait until two promote runs created at/after the boundary exist.
          MAX_ATTEMPTS=10
          ATTEMPT=0
          IDS=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            IDS=$(gh run list --workflow=promote.yaml --branch=main \
              --created=">=$CONC_SINCE" --limit=10 \
              --json=databaseId --jq='[.[].databaseId] | .[0:2] | join(" ")' 2>/dev/null || echo "")
            COUNT=$(echo "$IDS" | wc -w | tr -d ' ')
            [ "$COUNT" -ge 2 ] && break
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          COUNT=$(echo "$IDS" | wc -w | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::expected two concurrent promote runs, found $COUNT ($IDS)"
            exit 1
          fi
          ID1=$(echo "$IDS" | awk '{print $1}')
          ID2=$(echo "$IDS" | awk '{print $2}')
          # Watch both to a terminal state. cancel-in-progress:false means the
          # queued run is NOT cancelled, so both must conclude (success here,
          # since both are dry runs). A cancelled conclusion is the failure mode.
          gh run watch "$ID1" --exit-status --interval 60
          gh run watch "$ID2" --exit-status --interval 60
          for ID in "$ID1" "$ID2"; do
            CONCLUSION=$(gh run view "$ID" --json conclusion --jq '.conclusion')
            if [ "$CONCLUSION" = "cancelled" ]; then
              echo "::error::promote run $ID was cancelled - serialized concurrency (cancel-in-progress:false) was not honoured"
              exit 1
            fi
          done
          echo "id1=$ID1" >> "$GITHUB_OUTPUT"
          echo "id2=$ID2" >> "$GITHUB_OUTPUT"
          echo "OK: both promote runs reached a terminal state with no cancellation"

      - name: Register first serialized promote run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.conc.outputs.id1 }}
          expected-conclusion: success
          reason: release-concurrency-serialized-a
          upload: 'true'

      - name: Register second serialized promote run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.conc.outputs.id2 }}
          expected-conclusion: success
          reason: release-concurrency-serialized-b
          upload: 'true'

  manage-release-verbs:
    name: Manage-release lock and orphan-delete verbs
    runs-on: ubuntu-latest
    needs: release-gates
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The manage-release action shells out to the cascade CLI, so it must be
      # on PATH (matches promote.yaml's finalize job, which installs it first).
      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.16.6-dryrun.82
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          version: ${{ inputs.cascade_version || 'v0.16.6-dryrun.82' }}

      # The staging prerelease that merge-and-build cut still exists (the
      # terminal promote-staging job that publishes it runs after this job).
      # Resolve the current staging RC tag and lock it via the manage-release
      # lock verb, then assert the release is marked as a prerelease (locked).
      - name: Resolve current staging RC tag
        id: rc
        run: |
          set -euo pipefail
          git pull --rebase origin main --quiet || true
          RC_TAG=$(yq eval '.ci.state.staging.version // ""' .github/manifest.yaml)
          if [ -z "$RC_TAG" ]; then
            echo "::error::no staging RC version in state to exercise the lock verb"
            exit 1
          fi
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "staging RC tag: $RC_TAG"

      - name: Lock the staging prerelease
        uses: ./.github/actions/manage-release
        with:
          repo: ${{ github.repository }}
          action: lock
          environment: staging
          sha: ''
          tag: ${{ steps.rc.outputs.rc_tag }}
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Assert lock flipped the release to prerelease
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
        run: |
          set -euo pipefail
          # The locked release is still a DRAFT (lock only sets prerelease=true;
          # it does not publish). Drafts have no pushed git tag, so
          # `gh release view <tag>` reports "not found" and returns empty. Match
          # the draft via `gh release list --json ...` (which includes drafts),
          # the same mechanism the earlier draft-creation assert relies on.
          IS_PRERELEASE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,name,isDraft,isPrerelease \
            --jq ".[] | select(.tagName == \"$RC_TAG\" or .name == \"$RC_TAG\") | .isPrerelease" \
            | head -1)
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::lock verb did not leave release $RC_TAG as a prerelease (got isPrerelease='$IS_PRERELEASE')"
            exit 1
          fi
          echo "OK: lock verb left $RC_TAG marked as a prerelease"

      # Orphan-delete: seed a throwaway release for an env that is then skipped,
      # invoke the manage-release delete verb against it, and assert it is gone.
      - name: Seed an orphan release for the prod env
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          ORPHAN_TAG="orphan-$(date +%s)-$RANDOM"
          echo "ORPHAN_TAG=$ORPHAN_TAG" >> "$GITHUB_ENV"
          SRC_SHA=$(git rev-parse origin/main)
          gh release create "$ORPHAN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SRC_SHA" \
            --title "$ORPHAN_TAG" \
            --notes "orphaned-release-cleanup coverage" \
            --draft
          echo "seeded orphan release $ORPHAN_TAG"

      - name: Delete the orphan release via the delete verb
        uses: ./.github/actions/manage-release
        with:
          repo: ${{ github.repository }}
          action: delete
          environment: prod
          sha: ''
          tag: ${{ env.ORPHAN_TAG }}
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Assert orphan release removed
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          ORPHAN_TAG: ${{ env.ORPHAN_TAG }}
        run: |
          set -euo pipefail
          # The orphan was seeded as a DRAFT, so `gh release view <tag>` cannot
          # see it (drafts have no pushed tag) and would report "not found"
          # whether or not the delete actually ran. List drafts explicitly so a
          # silently-undeleted orphan is still caught.
          STILL_PRESENT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,name \
            --jq ".[] | select(.tagName == \"$ORPHAN_TAG\" or .name == \"$ORPHAN_TAG\") | .tagName" \
            | head -1)
          if [ -n "$STILL_PRESENT" ]; then
            echo "::error::delete verb did not remove orphan release $ORPHAN_TAG"
            exit 1
          fi
          echo "OK: delete verb removed orphan release $ORPHAN_TAG"

      # Rejoin cleanup: a second delete (idempotent) against an already-absent
      # tag must not error - the rejoin path re-runs delete on an env whose
      # orphan was already cleared.
      - name: Delete again - rejoin cleanup is idempotent
        uses: ./.github/actions/manage-release
        with:
          repo: ${{ github.repository }}
          action: delete
          environment: prod
          sha: ''
          tag: ${{ env.ORPHAN_TAG }}
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

  promote-staging:
    name: Promote staging to prod
    runs-on: ubuntu-latest
    needs: manage-release-verbs
    steps:
      - name: Install gh transient-retry wrapper
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'GHRETRY'
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          GHRETRY
          echo "BASH_ENV=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CASCADE_STATE_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Capture the staging RC marker BEFORE the terminal promote so the
      # post-promote asserts can prove the RC->semver resolution on final-env
      # publish and the RC tag deletion (Publish step passes delete_tag=rc).
      - name: Capture staging RC before promote
        id: rc_before
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          git pull --rebase origin main --quiet || true
          RC_BEFORE=$(yq eval '.ci.state.staging.version // ""' .github/manifest.yaml)
          echo "rc_before=$RC_BEFORE" >> "$GITHUB_OUTPUT"
          echo "staging RC before promote: $RC_BEFORE"

      - name: Dispatch promote workflow
        run: |
          # Capture a UTC dispatch boundary BEFORE firing so the wait step can
          # correlate the run THIS scenario started, not a stale promote run from
          # an earlier suite iteration. Back-date 60s to absorb clock skew.
          DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-60S +%Y-%m-%dT%H:%M:%SZ)
          echo "DISPATCH_SINCE=$DISPATCH_SINCE" >> "$GITHUB_ENV"
          gh workflow run promote.yaml -f mode=default --ref main

      - name: Wait for promote to complete
        id: wait_promote
        run: |
          # Resolve the promote run dispatched by THIS scenario (created at/after
          # the recorded boundary), then watch THAT id to completion and require
          # conclusion==success. Counting any "completed" run masks a failed
          # promotion, so assert success explicitly.
          MAX_ATTEMPTS=8
          SLEEP_DURATION=60
          ATTEMPT=0
          RUN_ID=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            RUN_ID=$(gh run list --workflow=promote.yaml --branch=main \
              --created=">=$DISPATCH_SINCE" --limit=1 \
              --json=databaseId --jq='.[0].databaseId // empty' 2>/dev/null || echo "")
            if [ -n "$RUN_ID" ]; then
              echo "Found promote run for this dispatch: $RUN_ID"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep "$SLEEP_DURATION"
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::promote.yaml run for this dispatch did not appear within timeout"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 60
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Register the promote run so reconcile accounts for it.
      - name: Register promote run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.wait_promote.outputs.run_id }}
          expected-conclusion: success
          reason: promote-staging-to-prod
          upload: 'true'

      - name: Assert release published, external state preserved
        run: |
          # In a [staging, prod] topology the terminal promotion publishes the
          # release and records the version under the .ci.state.release marker
          # (cascade's published-version marker), not under the per-environment
          # prod deploy slot. The final env emits no deploy jobs, so
          # .ci.state.prod stays empty by design; assert the release marker
          # carries the published semver instead.
          #
          # finalize pushes its state commit shortly after the promote run
          # reports completed, so poll-pull until the marker lands on main.
          MAX_ATTEMPTS=3
          ATTEMPT=0
          RELEASE_VERSION=""
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            git pull --rebase origin main --quiet || true
            RELEASE_VERSION=$(yq eval '.ci.state.release.version // ""' .github/manifest.yaml)
            [ -n "$RELEASE_VERSION" ] && break
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          if [ -z "$RELEASE_VERSION" ] || ! echo "$RELEASE_VERSION" | grep -qE 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::.ci.state.release.version missing or not semver: '$RELEASE_VERSION'"
            exit 1
          fi
          # External source state must survive the promote (no loss across stages).
          A_SHA_AFTER=$(yq eval '.ci.state.staging.external.artifact-a.sha // ""' .github/manifest.yaml)
          B_SHA_AFTER=$(yq eval '.ci.state.staging.external.artifact-b.sha // ""' .github/manifest.yaml)
          if [ -z "$A_SHA_AFTER" ] || [ -z "$B_SHA_AFTER" ]; then
            echo "::error::external source state lost during promote (a='$A_SHA_AFTER' b='$B_SHA_AFTER')"
            exit 1
          fi
          RELEASE_TAG=$(gh release list --limit=1 | tail -1 | awk '{print $1}')
          IS_PRERELEASE=$(gh release view "$RELEASE_TAG" --json=isPrerelease --jq='.isPrerelease')
          if [ "$IS_PRERELEASE" != "false" ]; then
            echo "::error::release $RELEASE_TAG still prerelease after promote"
            exit 1
          fi
          echo "OK: release marker=$RELEASE_VERSION tag=$RELEASE_TAG published; external state preserved"

      # Promote runtime side-effects (#325): on final-env publish the Publish
      # step resolves the RC tag to its semver (drops the -rc.N suffix) and
      # passes delete_tag=<rc_version> so the RC tag is removed. Assert both:
      # the published marker is the RC's semver, and the RC tag no longer exists.
      - name: Assert RC->semver resolution and RC tag deleted
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
          RC_BEFORE: ${{ steps.rc_before.outputs.rc_before }}
        run: |
          set -euo pipefail
          if [ -z "$RC_BEFORE" ]; then
            echo "::error::no staging RC captured before promote; cannot assert RC->semver resolution"
            exit 1
          fi
          git fetch origin main --quiet
          git reset --hard origin/main
          RELEASE_VERSION=$(yq eval '.ci.state.release.version // ""' .github/manifest.yaml)
          # The published semver is the RC with its -rc.N suffix stripped.
          EXPECT_SEMVER="${RC_BEFORE%%-rc.*}"
          if [ "$RELEASE_VERSION" != "$EXPECT_SEMVER" ]; then
            echo "::error::RC->semver resolution wrong: RC '$RC_BEFORE' should publish as '$EXPECT_SEMVER' but release marker is '$RELEASE_VERSION'"
            exit 1
          fi
          # The RC tag must have been deleted by the publish step (delete_tag).
          git fetch --tags --quiet || true
          if git rev-parse --verify --quiet "refs/tags/$RC_BEFORE" >/dev/null; then
            echo "::error::RC tag $RC_BEFORE still present after publish (delete_tag side-effect did not fire)"
            exit 1
          fi
          if gh release view "$RC_BEFORE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::RC release $RC_BEFORE still present after publish"
            exit 1
          fi
          echo "OK: RC $RC_BEFORE resolved to semver $RELEASE_VERSION and the RC tag was deleted"

      - name: Final snapshot (all envs + all external sources + release)
        if: always()
        run: |
          {
            echo "## promote-staging Final Snapshot"
            echo ""
            echo '```yaml'
            yq eval '.ci.state' .github/manifest.yaml
            echo '```'
            echo ""
            echo "| Assertion | Result |"
            echo "|-----------|--------|"
            echo "| Synchronous external uses: callback ran | check merge-and-build |"
            echo "| artifact-a absorbed (no loss) | check external-update-concurrent |"
            echo "| artifact-b absorbed (no loss) | check external-update-concurrent |"
            echo "| Concurrent updates serialized | check external-update-concurrent |"
            echo "| prod published + external preserved | OK |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Reconcile gate: structural coverage backstop. The per-stage asserts above
  # still gate each run they wait on; this job is additive. It enumerates EVERY
  # run this repo produced since window-start (captured before the first reset
  # push) and fails if any is unaccounted for in the ledger the register-run
  # steps uploaded - an unregistered non-success run, or a registered run that
  # concluded other than its expected conclusion. This turns any run the suite
  # forgot to gate, AND any unrelated in-window failure (e.g. the
  # shared/widget-b/dev External Update dispatches the artifact repos fire at
  # this repo), into a hard red until it is accounted for or stopped.
  reconcile:
    name: Reconcile scenario-window runs
    needs: [reset, merge-and-build, external-update-concurrent, release-gates, manage-release-verbs, promote-staging]
    if: always()
    uses: stablekernel/cascade/.github/workflows/fleet-reconcile.yaml@main
    permissions:
      contents: read
      actions: read
    with:
      window-start: ${{ needs.reset.outputs.window-start }}
      # Artifact mode: each register-run step uploaded a per-job ledger under
      # the default cascade-run-ledger-* name; reconcile globs and merges them.
      cascade-ref: main
