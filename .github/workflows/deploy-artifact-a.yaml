name: deploy-artifact-a
# Stub external-deploy callback tracking the shared artifact from
# stablekernel/cascade-example-artifact-a. Referenced by the primary's
# external[].deploys[].workflow for the artifact-a source.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: false
        type: string
      sha:
        description: Commit SHA from the source repo
        required: false
        type: string
      version:
        description: Version from the source repo
        required: false
        type: string
      deploy_name:
        description: Component slot the receiver scoped this deploy to (#213 deploy-on-update)
        required: false
        type: string
    outputs:
      deploy_url:
        description: URL of the tracked artifact
        value: ${{ jobs.deploy.outputs.deploy_url }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - id: deploy
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          DEPLOY_NAME: ${{ inputs.deploy_name }}
        run: |
          echo "Tracking artifact-a version=${VERSION:-dev} sha=${SHA:-local} env=${ENVIRONMENT}"
          # Deterministic deploy marker for the deploy-on-update fleet assertion (#213).
          echo "CASCADE_DEPLOY_MARKER deploy_name=${DEPLOY_NAME:-artifact-a} version=${VERSION:-dev} sha=${SHA:-local}"
          sleep 2
          echo "deploy_url=https://example.com/artifact-a/${ENVIRONMENT}/${SHA:-local}" >> "$GITHUB_OUTPUT"
